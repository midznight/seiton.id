name: One-time AI agent skill installation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  install-skills:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Seiton.id
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run requested skills CLI commands in order
        shell: bash
        env:
          CI: "1"
        run: |
          set -uo pipefail
          failures=()

          run_skill_install() {
            local label="$1"
            shift
            echo
            echo "========== $label =========="
            if npx --yes skills add "$@" -y; then
              echo "INSTALL_OK: $label"
            else
              local status=$?
              echo "INSTALL_FAILED ($status): $label"
              failures+=("$label")
            fi
          }

          # 1. Meta-Skill & Workflow
          run_skill_install "vercel-labs/find-skills" vercel-labs/find-skills
          run_skill_install "obra/superpowers" obra/superpowers
          run_skill_install "mattpocock/skills (grill-me, tdd)" mattpocock/skills --skill grill-me tdd

          # 2. Software & System Architect
          run_skill_install "eralmansouri/skills" eralmansouri/skills
          run_skill_install "tt-a1i/archify" tt-a1i/archify
          run_skill_install "fallow-rs/fallow-skills" fallow-rs/fallow-skills

          # 3. Backend & Database
          run_skill_install "addyosmani/agent-skills (api-and-interface-design)" addyosmani/agent-skills --skill api-and-interface-design
          run_skill_install "wshobson/agents (backend-architect, database-architect)" wshobson/agents --skill backend-architect database-architect

          # 4. Security
          run_skill_install "trailofbits/skills" trailofbits/skills
          run_skill_install "wshobson/agents (security-auditor)" wshobson/agents --skill security-auditor

          # 5. UI / UX & Frontend Design
          # UI UX Pro Max is already present from the previously merged PR #23.
          if [ -f ".agents/skills/ui-ux-pro-max/SKILL.md" ]; then
            echo "ALREADY_INSTALLED: nextlevelbuilder/ui-ux-pro-max-skill"
          else
            run_skill_install "nextlevelbuilder/ui-ux-pro-max-skill" nextlevelbuilder/ui-ux-pro-max-skill
          fi
          run_skill_install "anthropics/skills (frontend-design)" anthropics/skills --skill frontend-design
          run_skill_install "vercel-labs/web-design-guidelines" vercel-labs/web-design-guidelines
          run_skill_install "pbakaus/impeccable" pbakaus/impeccable
          run_skill_install "Leonxlnx/taste-skill" Leonxlnx/taste-skill

          printf '%s\n' "${failures[@]}" > /tmp/skills-install-failures.txt
          echo
          echo "========== Installation summary =========="
          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'FAILED: %s\n' "${failures[@]}"
          else
            echo "All requested CLI install commands completed."
          fi

      - name: Record installed skill inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo "# AI Agent Skills — project inventory"
            echo
            echo "Installed in the Seiton.id repository on $(date -u +%F)."
            echo "Universal project-local skill path: `.agents/skills/<skill-name>/SKILL.md`."
            echo
            echo "## Existing skill"
            echo "- `.agents/skills/ui-ux-pro-max/SKILL.md` — nextlevelbuilder/ui-ux-pro-max-skill (already installed before this run)."
            echo
            echo "## Skill entry points detected after installation"
            find .agents/skills .claude/skills -type f -name SKILL.md -print 2>/dev/null | sort | sed 's#^\./#- #' || true
            echo
            echo "## CLI command failures"
            if [ -s /tmp/skills-install-failures.txt ]; then
              sed 's/^/- /' /tmp/skills-install-failures.txt
            else
              echo "None."
            fi
            echo
            echo "## Invocation"
            echo "Coding agents should read the relevant skill's SKILL.md before performing that discipline's work."
            echo "For Codex/agents that support the Skills convention, invoke by describing the task and naming the skill, e.g. 'Use the backend-architect skill to review this API' or 'Use frontend-design to improve this page'."
          } > docs/AI-AGENT-SKILLS.md
          echo
          echo "Installed SKILL.md files:"
          find .agents/skills .claude/skills -type f -name SKILL.md -print 2>/dev/null | sort || true

      - name: Commit installed skills and remove one-time installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/install-agent-skills-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "chore: install requested AI agent skills"
          git push origin "HEAD:${TARGET_BRANCH}"
