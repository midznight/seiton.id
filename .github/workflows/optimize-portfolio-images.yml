name: Optimize portfolio images

on:
  push:
    branches:
      - fix/p2-performance-seo-security
    paths:
      - "assets/*.jfif"
      - ".github/workflows/optimize-portfolio-images.yml"
      - "**/*.html"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/p2-performance-seo-security
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Convert large JFIF images to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          assets = Path("assets")
          converted = {}
          for source in sorted(assets.glob("*.jfif")):
              target = source.with_suffix(".webp")
              with Image.open(source) as original:
                  image = ImageOps.exif_transpose(original).convert("RGB")
                  image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  image.save(target, "WEBP", quality=82, method=6)
              converted[source.name] = target.name
              print(f"{source.name}: {source.stat().st_size:,} -> {target.stat().st_size:,} bytes")
          if not converted:
              print("No JFIF images found; nothing to convert.")

          for html in Path(".").rglob("*.html"):
              text = html.read_text(encoding="utf-8")
              updated = text
              for old, new in converted.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  html.write_text(updated, encoding="utf-8")

          for old in converted:
              (assets / old).unlink()
          PY
      - name: Commit optimized assets and updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimize portfolio photos as WebP"
            git push origin HEAD:fix/p2-performance-seo-security
          fi
