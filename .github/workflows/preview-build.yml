name: Build Seiton preview
on:
  push:
    branches:
      - rebuild
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build main website
        run: npm run build:site
      - name: Build demo website
        run: npm run build:demo
      - name: Verify static output
        run: node scripts/check-site-build.mjs
