name: Build Seiton preview
on:
  push:
    branches:
      - main
      - rebuild
  pull_request:
    branches:
      - main
      - rebuild
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_PAGES: "1"
      CF_PAGES_BRANCH: "rebuild"
      SEITON_MAIN_PREVIEW_URL: "http://127.0.0.1:4321"
      SEITON_DEMO_PREVIEW_URL: "http://127.0.0.1:4322"
      MAIN_BASE_URL: "http://127.0.0.1:4321"
      DEMO_BASE_URL: "http://127.0.0.1:4322"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build main website
        run: npm run build:site
      - name: Build demo website
        run: npm run build:demo
      - name: Verify static output
        run: node scripts/check-site-build.mjs
      - name: Check performance budget
        run: npm run check:performance
      - name: Check demo image assets
        run: npm run check:assets
      - name: Install audit tooling and Chromium
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright lighthouse
          npx playwright install --with-deps chromium
      - name: Start local preview servers
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/seiton-main.log 2>&1 &
          python3 -m http.server 4322 --directory dist-demo >/tmp/seiton-demo.log 2>&1 &
      - name: Test Google Tag Manager container
        run: npm run test:tag-manager
      - name: Test customer journey and responsive layouts
        run: npm run test:journey
      - name: Audit mobile accessibility (axe WCAG)
        run: npm run audit:mobile
      - name: Measure mobile Lighthouse metrics
        run: npm run audit:lighthouse
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seiton-mobile-audit-${{ github.sha }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 30
