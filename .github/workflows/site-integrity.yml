name: Site integrity

on:
  pull_request:
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "scripts/check-site-integrity.mjs"
      - ".github/workflows/site-integrity.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public pages
        run: node scripts/check-site-integrity.mjs
