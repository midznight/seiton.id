name: Site integrity

on:
  push:
    branches:
      - rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Astro source content
        run: node scripts/check-site-integrity.mjs
